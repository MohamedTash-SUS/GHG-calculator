const COURSE = [
 {id:'d1-1',day:1,number:'1.1',title:'Industrial emissions and environmental impact',pages:'3–17',lab:'dispersion',minutes:20,short:'Source → pollutant → pathway → exposure → effect.',
 fundamentals:['An emission is a release from a source; the impact depends on how it is transported and who or what is exposed. Mass rate alone is not a measure of risk.','Separate point sources (stacks and controlled vents), fugitive sources (valves and seals), evaporative sources (tanks and wastewater), and intermittent sources (flares, starts and shutdowns).','Refinery pollutants include NOₓ, SOₓ, CO, particulate matter, VOC/HAP, H₂S and other reduced sulfur compounds, plus greenhouse gases. Their atmospheric chemistry and health effects differ.'],
 refinery:'Trace a furnace stack and a storage-tank breathing loss separately. A furnace may be monitored for gases and flow at a stack; a tank requires seal, operating and vapor-loss information. Both may contribute to off-site concentrations.',
 watch:'Never equate a visible plume with total hazard, or assume a low stack concentration implies a low annual emission load.',terms:['Source','Emission rate','Receptor','Primary pollutant','Secondary pollutant'],key:'A complete source inventory is the foundation of every later calculation, control and compliance decision.'},
 {id:'d1-2',day:1,number:'1.2',title:'History and evolution of control',pages:'18–32',lab:'dispersion',minutes:12,short:'From visible smoke to measurable multi-pollutant management.',
 fundamentals:['Industrial smoke and sulfur pollution predate modern controls; the Industrial Revolution increased source density and emission mass.','Episodes such as the Meuse Valley, Donora and London smogs showed how weather and local terrain can turn ordinary releases into acute exposure crises.','Regulation evolved from smoke nuisance toward source limits, ambient standards, hazardous pollutants, continuous data, fugitive-emission programs and environmental management.'],
 refinery:'Modern requirements for stack tests, continuous monitoring, LDAR, inventories and abnormal-event logs address different blind spots in the historical control approach.',
 watch:'A taller stack can redistribute a plume; it does not eliminate the emitted mass.',terms:['Ambient standards','Stack standards','CEMS','BAT'],key:'Better measurement and better understanding of exposure made broader environmental regulation possible.'},
 {id:'d1-3',day:1,number:'1.3',title:'Economics and environmental trade-offs',pages:'33–47',lab:'economics',minutes:22,short:'Choose the best compliant system—not the cheapest device.',
 fundamentals:['Control selection begins with preventing the pollutant at source; feasible options then proceed through process modification, recovery and residual treatment.','Installed capital cost includes equipment, foundations, ducting, instrumentation, integration, engineering and downtime. Operating cost includes power, reagents, labor, maintenance, waste and supplemental fuel.','Compare options at a consistent annualized cost and consider secondary wastewater, sludge, energy, greenhouse gases, corrosion, footprint and reliability.'],
 refinery:'A wet scrubber may cut stack acid gas while producing wastewater and sludge; a dry sorbent system may create solids. Both require plant-wide evaluation and monitoring.',
 watch:'Do not use a nominal removal-efficiency claim to make an investment decision without checking turndown, raw-gas variability and cross-media effects.',terms:['CAPEX','OPEX','CRF','BAT','Cost effectiveness'],key:'Compliance and technical feasibility are mandatory; lifecycle cost ranks the remaining viable options.'},
 {id:'d1-4',day:1,number:'1.4',title:'Refinery operations: air, water and land',pages:'48–62',lab:'inventory',minutes:22,short:'One operation can release pollutants through several media.',
 fundamentals:['Combustion systems, FCC regenerators, sulfur recovery units, storage and loading, fugitive equipment, wastewater and maintenance each produce distinct emission profiles.','Air pathways include stacks, vents, leaks, evaporation and flares; water pathways include process wastewater, cooling blowdown and stormwater; land pathways include sludge, catalyst fines and contaminated soil.','End-of-pipe air controls often generate residual waste or wastewater. Follow the mass across the entire facility boundary.'],
 refinery:'For a fluid catalytic cracking unit, inventory catalyst regenerator flue gas, collected fines, possible wet-control blowdown, spent catalyst and abnormal routing.',
 watch:'A wastewater-treatment unit may be both an air source (VOC/H₂S) and a sludge producer while discharging treated water.',terms:['FCCU','SRU','Sour water','Catalyst fines','Cross-media transfer'],key:'Always draw the source-to-media map before selecting a treatment method.'},
 {id:'d1-5',day:1,number:'1.5',title:'Environmental risk assessment and response',pages:'63–77',lab:'risk',minutes:25,short:'Hazard → source term → consequence → likelihood → barrier.',
 fundamentals:['Hazard identification uses inventories, process knowledge and structured studies such as What-if, HAZOP, FMEA and PHA.','Risk screening combines likelihood and consequence. More detailed studies quantify the release source term, dispersion or other transport, exposure and possibly fire and explosion effects.','Risk reduction uses independent layers: process improvement, engineered controls, containment, preventive maintenance, detection, monitoring, contingency plans and emergency response.'],
 refinery:'An H₂S release from sour-gas handling differs from continuous SO₂ emissions: toxic concentration, isolation time, wind and receptor location dominate acute consequence assessment.',
 watch:'A 5×5 risk matrix is only a prioritization tool; its numbers are not predicted fatalities or risk frequencies.',terms:['Source term','HAZOP','Consequence','Individual risk','F–N curve'],key:'Define the credible scenario and its evidence before assigning a risk score.'},
 {id:'d2-1',day:2,number:'2.1',title:'Continuous Emissions Monitoring Systems',pages:'79–90',lab:'cems',minutes:28,short:'An analyzer is only one component of the compliance record.',

ide a designed stack/vent pathway.'],['HAP','Hazardous Air Pollutant; certain toxic airborne substances.'],['Henry’s law','Equilibrium relationship between dissolved and gas-phase concentrations under defined conditions.'],['In-situ monitor','Instrument that measures directly in a stack or duct rather than extracting a sample.'],['Isokinetic sampling','Sampling approach used for particulate collection to minimize particle-size bias.'],['KGa','Volumetric overall gas-side mass-transfer coefficient in absorption design.'],['LDAR','Leak Detection and Repair program for relevant components.'],['LNB','Low-NOₓ burner; reduces conditions favoring NOₓ formation.'],['Mass balance','Conservation relation: inputs = outputs + accumulation + losses.'],['Method 21','EPA method for VOC leak detection via instrument screening at equipment.'],['NDIR','Non-Dispersive Infrared gas measurement technique.'],['NOₓ','Nitrogen oxides, principally NO and NO₂ in air-control context.'],['NTU','Number of transfer units; dimensionless mass-transfer design measure.'],['OPEX','Recurring cost of operating and maintaining a control system.'],['Opacity','Fraction of transmitted light blocked by stack emissions.'],['PID','Photoionization Detector used for VOC screening within detector limitations.'],['PM₂.₅','Particles with aerodynamic diameter ≤2.5 μm.'],['RCER-2015','Royal Commission Environmental Regulations, 2015 edition in the source pack.'],['Receptor','Person, ecosystem or asset exposed to pollutants.'],['Removal efficiency','Inlet pollutant mass minus outlet mass, divided by inlet mass.'],['SCR','Selective Catalytic Reduction of NOₓ using an appropriate catalyst and reagent.'],['SNCR','Selective Non-Catalytic Reduction of NOₓ in suitable temperature range.'],['SOₓ','Sulfur oxides, including SO₂ and SO₃.'],['Source term','Description of an emitted/released quantity, rate, composition, duration and conditions.'],['SRU','Sulfur Recovery Unit, often using Claus reaction.'],['TCLP','Toxicity Characteristic Leaching Procedure used in some waste classification frameworks.'],['TRS','Total Reduced Sulfur.'],['Turnaround','Planned refinery shutdown/maintenance campaign with abnormal emissions and waste potential.'],['VOC','Volatile Organic Compound.'],['WMF / WRF','Waste Management Facility / Waste Recycling Facility under RCER terminology.']

function stats(items){return `<div class="stat-grid">${items.map(a=>meter(...a)).join('')}</div>`}
function insight(text){return `<div class="analysis-box"><b>Interpretation & next decision</b><p>${text}</p></div>`}
function formula(text){return `<div class="formula">${text}</div>`}
function hBar(label,value,color='#1aa193'){return `<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:14px"><span>${esc(label)}</span><b>${f(value,1)}</b></div><div class="bar-track"><div class="bar-fill" style="width:${clamp(value,0,100)}%;background:${color}"></div></div>`}
function multiBars(items,max=100){return `<div style="margin:15px 0">${items.map(([name,val,color])=>`<div style="display:flex;align-items:center;gap:12px;margin:12px 0"><span style="font-size:11px;width:115px;flex:0 0 115px">${esc(name)}</span><div class="bar-track" style="margin:0;flex:1;height:17px"><div class="bar-fill" style="width:${clamp(val/max*100,0,100)}%;background:${color||'#139b94'}"></div></div><b style="font-size:11px;width:65px;text-align:right">${f(val,1)}</b></div>`).join('')}</div>`}
function lineChart(arr,highlightX=null){const width=620,height=232,L=52,R=20,T=18,B=40;const xmax=Math.max(...arr.map(a=>a[0]));const xmin=Math.min(...arr.map(a=>a[0]));const ymax=Math.max(0.000001,...arr.map(a=>a[1]))*1.1;const sx=x=>L+(x-xmin)/(xmax-xmin)*(width-L-R);const sy=y=>height-B-(y/ymax)*(height-T-B);const path=arr.map((d,i)=>`${i?'L':'M'} ${sx(d[0]).toFixed(1)} ${sy(d[1]).toFixed(1)}`).join(' ');return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Modeled concentration versus receptor distance"><path d="M${L} ${T} V${height-B} H${width-R}" stroke="#9fb6bb" fill="none" stroke-width="1.5"/>${[0,1,2,3,4].map(i=>`<line x1="${L}" y1="${sy(ymax*i/4)}" x2="${width-R}" y2="${sy(ymax*i/4)}" stroke="#dce6e7"/><text x="${L-8}" y="${sy(ymax*i/4)+4}" text-anchor="end">${f(ymax*i/4,2)}</text>`).join('')}<path d="${path}" fill="none" stroke="#079b95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${highlightX!==null?`<line x1="${sx(highlightX)}" y1="${T}" x2="${sx(highlightX)}" y2="${height-B}" stroke="#da8154" stroke-width="2" stroke-dasharray="5 4"/>`:''}<text x="${width/2}" y="${height-8}" text-anchor="middle">Distance downwind (m)</text><text x="${L}" y="11">Concentration (µg/m³; illustrative)</text></svg>`}
function riskMatrix(x,y){let cells='';for(let yy=5;yy>=1;yy--){for(let xx=1;xx<=5;xx++){let score=xx*yy,color=score<=5?'#d7f1de':score<=10?'#fff1c6':score<=15?'#ffe0b6':'#f5beb9';cells+=`<rect x="${45+(xx-1)*62}" y="${25+(5-yy)*48}" width="58" height="44" rx="4" fill="${color}" stroke="${xx===x&&yy===y?'#0c6567':'#d9e4e5'}" stroke-width="${xx===x&&yy===y?4:1}"/><text x="${74+(xx-1)*62}" y="${53+(5-yy)*48}" fill="#2e4f53" font-size="13" text-anchor="middle" font-weight="${xx===x&&yy===y?'900':'600'}">${score}</text>`;}}
return `<svg class="chart-svg" viewBox="0 0 405 315" role="img" aria-label="Training 5 by 5 likelihood consequence risk matrix"><text x="10" y="19">Consequence ↑</text>${cells}${[1,2,3,4,5].map(i=>`<text x="${74+(i-1)*62}" y="288" text-anchor="middle">${i}</text>`).join('')}<text x="199" y="309" text-anchor="middle">Likelihood →</text></svg>`}
function calculation(id,p){switch(id){case 'calculator':{let raw=p.c*p.q/1e6,post=raw*(1-p.eff/100),annual=post*p.hours/1000,avoid=raw*p.eff/100*p.hours/1000,need=clamp(100*(1-p.target/p.c),0,100);let ok=p.c*(1-p.eff/100)<=p.target;return {body:stats([['Uncontrolled mass rate',f(raw,2),'kg/h'],['Controlled mass rate',f(post,2),'kg/h','highlight'],['Controlled annual load',f(annual,1),'t/y'],['Mass avoided',f(avoid,1),'t/y']])+multiBars([['Inlet (mg/Nm³)',p.c,'#c75d54'],['Outlet',p.c*(1-p.eff/100),'#139b94'],['Exercise target',p.target,'#b88a47']],Math.max(p.c,p.target))+insight(`<span class="qual ${ok?'good':'bad'}">${ok?'Meets the illustrative target.':'Does not meet the illustrative target.'}</span> Required minimum efficiency for this chosen target is <b>${pct(need)}</b>. Confirm wet/dry basis, operating hours, applicable averaging and the actual permit requirement before interpreting compliance.`)+formula(`Mass (kg/h) = C (mg/Nm³) × Q (Nm³/h) / 10⁶<br>Annual (t/y) = kg/h × operating hours / 1000<br>Outlet C = inlet C × (1 − η)`),record:{raw,post,annual,avoid,need}}}
 case 'combustion':{const r=p.load/80;let nox=100*r**1.2*(1+.09*(p.o2-3))*(p.lnb==='yes'?.65:1)*(p.scr==='yes'?.25:1);let sox=100*r*(p.sulfur/.2);let co=100*r*(1+Math.max(0,2.5-p.o2)**2*.4+(p.load<60?.22:0));let co2=100*r;const highCO=p.o2<2;return {body:stats([['NOₓ tendency index',f(nox,0),'80% load / 3% O₂ baseline = 100','highlight'],['SOₓ source index',f(sox,0),'Relative to baseline fuel sulfur'],['CO tendency index',f(co,0),'Simplified incomplete-combustion proxy'],['CO₂ source index',f(co2,0),'Relative to baseline energy throughput']])+multiBars([['NOₓ',nox,'#e09660'],['SOₓ',sox,'#c75e6b'],['CO',co,'#6b83b1'],['CO₂',co2,'#159d98']],Math.max(130,nox,sox,co,co2))+insight(`${highCO?'<span class="qual bad">Low-O₂ combustion warning.</span> ':'At the chosen O₂ setting, combustion tuning still requires flame stability verification. '}An LNB modifies flame conditions, while an SCR reduces downstream NOₓ in its qualified operating window. Fuel sulfur principally drives sulfur oxide potential; CO₂ remains tied to actual fuel carbon and heat demand.`)+formula('All four bars are synthetic, dimensionless relationship indices, NOT calculated stack concentrations.'),record:{nox,sox,co,co2}}}
 case 'dispersion':{const coeff={A:[.32,.23,.88,.78],D:[.16,.11,.89,.82],F:[.10,.06,.88,.77]}[p.stability];function conc(x){const sy=coeff[0]*x**coeff[2],sz=coeff[1]*x**coeff[3];const qg=p.mass*1000/3600;return (qg/(Math.PI*p.wind*sy*sz))*Math.exp(-p.height*p.height/(2*sz*sz))*1e6;}const c=conc(p.distance),series=Array.from({length:55},(_,i)=>{const x=200+i*(3800/54);return [x,conc(x)]});const peak=series.reduce((a,b)=>a[1]>b[1]?a:b);return {body:stats([['Receptor centerline',f(c,2),'µg/m³ (teaching model)','highlight'],['Max in displayed transect',f(peak[1],2),`µg/m³ near ${f(peak[0],0)} m`],['Release rate',f(p.mass/3.6,2),'g/s'],['Effective release height',f(p.height,0),'m']])+lineChart(series,p.distance)+insight('For fixed mass release, wind and mixing govern dilution while release height moves the location of the strongest ground-level response. A simplistic stability class does not capture inversion layering, urban structures, topography, chemistry or cumulative background concentration.')+formula('Ground centerline C ≈ Q/(π u σᵧ σ𝓏) × exp[−H²/(2σ𝓏²)] ; σ are simplified distance/stability functions.'),record:{concentration:c,peak:peak[1]}}}
 case 'cems':{let reading=p.true*(1+p.drift/100)*(1-p.loss/100)+p.interf;let bias=reading-p.true,biasp=p.true>0?bias/p.true*100:0;let mass=reading*(64.066/22.414)*p.flow/1e6;let valid=p.cal==='pass'&&Math.abs(biasp)<=5;let status=p.cal==='fail'?'Calibration/QC failure — hold affected readings for data-quality review.':Math.abs(biasp)>5?'Teaching bias alert — investigate calibration, matrix and sample handling.':'No teaching alert at the configured settings.';return {body:stats([['Simulated true SO₂',f(p.true,1),'ppmv'],['Analyzer-indicated',f(reading,1),'ppmv','highlight'],['Indication bias',f(biasp,1),'% of simulated truth',Math.abs(biasp)>5?'alert':''],['Apparent SO₂ mass rate',f(mass,2),'kg/h using 0°C / 1 atm dry basis']])+multiBars([['True simulated gas',p.true,'#438f9d'],['Indicated value',reading,'#e39a57']],Math.max(1,p.true,reading)*1.15)+insight(`<span class="qual ${valid?'good':'bad'}">${status}</span> The apparent kg/h result is not regulatory-reportable merely because it was calculated. A DAHS must retain calibration flags, analyzer status, flow and approved validation/substitution logic.`)+formula('SO₂ mg/Nm³ = ppmv × 64.066/22.414 (0°C and 1 atm)<br>Apparent kg/h = mg/Nm³ × dry Nm³/h / 10⁶'),record:{reading,biasp,mass,valid}}}
 case 'ldar':{let threshold=p.service==='voc'?10000:p.service==='hap'&&['valve','flange'].includes(p.component)?500:null;let applicable=threshold!==null;let exceed=applicable&&p.reading>threshold;let status=!applicable?'Applicability cannot be decided from this training example. Review the exact clause and component definition.':p.qa==='fail'?'Instrument QA failed: recheck instrument before making a compliance determination.':exceed?'Screening above the applicable study threshold. Tag, document and initiate repair and re-monitoring.':'Screening is not above this selected leak definition; maintain the monitoring record.';let final=exceed&&p.repaired==='yes'?'A recorded recheck is not necessarily a passing recheck; record the measured post-repair value.':exceed?'Repair closure evidence is outstanding.':'Document the observation and applicable inspection schedule.';return {body:stats([['Selected screening threshold',applicable?f(threshold,0):'Check rule','ppmv, RCER-2015 example'],['Field reading',f(p.reading,0),'ppmv'],['Reading ÷ threshold',applicable?f(p.reading/threshold,2):'—','ratio'],['QA check',p.qa==='pass'?'Passed':'Failed','instrument status',p.qa==='pass'?'highlight':'alert']])+hBar('Reading relative to 20,000 ppmv display scale',p.reading/20000*100)+insight(`<span class="qual ${p.qa==='fail'||exceed?'bad':'good'}">${status}</span><br>${final} ppmv at a component is not the leak’s mass emission rate or a fence-line ambient concentration.`)+formula('Source-course screening examples: VOC service >10,000 ppmv; specified organic-HAP valves/flanges/connectors >500 ppmv.<br>Threshold comparison here uses strictly “greater than” as shown in the source.'),record:{threshold,reading:p.reading,exceed,qa:p.qa}}}
 case 'control':{const fit={fcc:['bag','cyclone','scrubber'],heater:['scr'],tank:['carbon','oxid'],wastewater:['bio','scrubber','carbon','oxid'],sru:['scrubber']};const compatible=fit[p.source].includes(p.tech);let m=p.cin*p.q/1e6,rem=m*p.eff/100,post=m-rem,power=(p.q/3600)*(p.dp*1000)/.68/1000,route={bag:'Captured dry dust / spent filter media',cyclone:'Separated catalyst or other particulate solids',scrubber:'Spent absorption liquor, blowdown and sludge',scr:'Spent catalyst / reagent slip considerations',carbon:'Spent or regenerated adsorbent, condensate/recovered VOC',oxid:'Combustion products, fuel demand and possibly acid gas',bio:'Biomass / spent media / nutrient water'}[p.tech];return {body:stats([['Inlet mass rate',f(m,2),'kg/h'],['Residual after assumed control',f(post,2),'kg/h','highlight'],['Mass captured / converted',f(rem,2),'kg/h'],['Fan-power proxy',f(power,1),'kW (assumed actual ≈ standard flow)']])+multiBars([['Inlet pollutant',m,'#cd6863'],['Captured/treated',rem,'#159d98'],['Outlet',post,'#b58c57']],Math.max(.01,m))+insight(`<span class="qual ${compatible?'good':'bad'}">${compatible?'Plausible mechanism for screening.':'Selected equipment is not a primary fit for this source/pollutant combination.'}</span> ${compatible?'Proceed only after checking actual stream chemistry, temperature, moisture, installation envelope and design guarantees.':'Revisit the source pollutant and technology mechanism before doing detailed design.'}<br><strong>Secondary stream:</strong> ${route}.`)+formula('Captured (kg/h) = inlet mass rate × assumed removal fraction<br>Fan proxy P ≈ Qactual × ΔP /(3600 × fan efficiency) ; uses 68% assumed fan efficiency'),record:{compatible,post,rem,power}}}
 case 'treatment':{const kFactor={low:.25,medium:1,high:2.2}[p.affinity];let humidityFactor=clamp((p.humid-20)/55,.15,1);let ntu=p.method==='packed'?(p.time/13)*kFactor:(p.time/36)*kFactor*humidityFactor;let eta=100*(1-Math.exp(-Math.max(0,ntu)));let inrate=p.conc*p.flow/1e6,outrate=inrate*(1-eta/100),converted=inrate-outrate;let resid=p.method==='packed'?'Transferred material resides in solvent/blowdown; ensure liquid treatment and corrosion control.':'Transferred biodegradable material is biologically oxidized or incorporated into biomass; monitor media, moisture, pressure loss and nutrients.';return {body:stats([['Illustrative removal',pct(eta),'kinetic / transfer proxy','highlight'],['Outlet concentration',f(p.conc*(1-eta/100),1),'mg/Nm³'],['Captured/converted',f(converted,2),'kg/h'],['Model NTU / effective index',f(ntu,2),'dimensionless']])+multiBars([['Inlet',p.conc,'#b65c5a'],['Outlet',p.conc*(1-eta/100),'#1b9b91']],p.conc)+insight(`${resid} ${p.method==='bio'&&p.humid<60?'<span class="qual warn">Low humidity penalizes this bio-treatment teaching model.</span>':''} Apparent efficiency does not prove chemical compatibility, biological activity or permit performance.`)+formula('Teaching approximation: C_out = C_in × exp(−effective transfer/reaction index)<br>Absorption index ∝ contact time × gas/liquid affinity; biological index also depends on humidity.'),record:{eta,outrate,converted}}}
 case 'waste':{let streamHints={oily:'Potentially hazardous oily sludge; recovery, dewatering and characterization may be relevant.',catalyst:'Catalyst fines and spent catalyst require characterization for hydrocarbons/metals and appropriate management.',caustic:'Spent caustic may be corrosive/reactive; prevent incompatible acid contact.',packaging:'Clean packaging may be classified based on contamination and process knowledge.',carbon:'Spent carbon can retain VOC/HAP and may require safety and hazardous-waste evaluation.'};let checks=[p.classify==='test',p.store==='seg',p.transport==='approved',p.route==='evaluate'];let score=checks.filter(Boolean).length;let good=score===4;return {body:stats([['Controls correctly selected',`${score} / 4`,'screening checklist','highlight'],['Classification documented?',checks[0]?'Yes':'No','process knowledge / testing',checks[0]?'':'alert'],['Storage segregation?',checks[1]?'Yes':'No','containment / compatibility'],['Chain of custody?',checks[2]?'Yes':'No','approved shipment + manifest']])+multiBars([['Classification',checks[0]?100:0,'#178e83'],['Storage',checks[1]?100:0,'#178e83'],['Transport',checks[2]?100:0,'#178e83'],['Final route',checks[3]?100:0,'#178e83']],100)+insight(`<span class="qual ${good?'good':'bad'}">${good?'A defensible management sequence is selected.':'One or more critical management steps remain unacceptable.'}</span> ${streamHints[p.stream]} RCER source requirements address approved transporter/facility use, proper manifests and generator responsibility; recovery must be evaluated before final disposal. The selected action does not by itself classify a waste as safe.`)+formula('Generator → characterize → minimize / recover → segregate / contain → approved manifest transport → verify final treatment / disposal'),record:{score,stream:p.stream}}}
 case 'inventory':{let mapping={heater:{name:'Point source — combustion',media:'AIR',poll:'NOₓ, SOₓ, CO, PM, CO₂',methods:['cems','stack'],why:'Continuous or periodic source tests with flow/operating context; check actual monitoring triggers.'},fcc:{name:'Point source + separated solids',media:'AIR + LAND',poll:'PM/catalyst fines, CO, SO₂',methods:['cems','stack'],why:'Combine stack monitoring/testing and collected-solids tracking.'},tank:{name:'Evaporative / storage source',media:'AIR + possible WATER/LAND',poll:'VOCs and HAPs',methods:['estimate'],why:'Use tank design, vapor pressure, throughput, temperature, seal/control data and approved source estimates.'},valve:{name:'Fugitive equipment component',media:'AIR',poll:'VOC/HAP in service',methods:['ldar'],why:'Component screening and maintenance tracking are the source-identification tools; mass estimation is separate.'},flare:{name:'Intermittent combustion source',media:'AIR',poll:'SO₂, CO, VOCs, PM, GHG',methods:['flare'],why:'Flare-gas flow/composition, flame status and time-stamped event data characterize source conditions.'},ww:{name:'Area source + water/sludge stream',media:'AIR + WATER + LAND',poll:'VOC, H₂S, ammonia, treated water and sludge',methods:['estimate','water'],why:'Gas/odor campaigns plus water quantity/quality and sludge records are needed; water-only measurement is insufficient for air.'}};let m=mapping[p.source],fit=m.methods.includes(p.method),unusual=p.oper!=='normal';return {body:stats([['Source class',m.name,'inventory category','highlight'],['Media affected',m.media,'source-to-media map'],['Method fit',fit?'Good first choice':'Incomplete','screening only',fit?'':'alert'],['Event duration',f(p.hours,0),'hours to document']])+`<div class="analysis-box"><b>Expected pollutant profile</b><p>${m.poll}</p></div>`+insight(`<span class="qual ${fit?'good':'bad'}">${fit?'Chosen primary method fits the exercise.':'This method misses an important source behavior.'}</span> ${m.why} ${unusual?'Abnormal operation requires a specific event log, process state, quantity estimate and related reports.':'A normal source still needs operating context and traceable long-term inventory records.'}`)+formula('Inventory record: source ID + release class + media + pollutant + measured/estimated mass + method + validity + operating mode + records'),record:{fit,source:p.source,mode:p.oper,media:m.media}}}
 case 'dahs':{const original=[80,87,91,95,111,133,168,152,118,108,102,93],array=original.map(v=>v+p.bias);let valid=array.map((v,i)=>i<12-p.invalid);let actual=array.filter((_,i)=>valid[i]);let avg=actual.reduce((a,b)=>a+b,0)/actual.length;let falsified=(actual.reduce((a,b)=>a+b,0))/12;let carried=[...actual,...Array(p.invalid).fill(actual[actual.length-1])];let selected=p.handle==='flag'?avg:p.handle==='zero'?falsified:carried.reduce((a,b)=>a+b,0)/12;let pass=p.handle==='flag'&&p.event==='no'||p.handle==='flag'&&p.event==='yes'&&p.context==='yes';let exceeded=avg>p.limit;let bars=`<div style="margin-top:15px"><div class="small-label">12 simulated five-minute records · grey bars flagged invalid</div><div style="display:flex;gap:5px;height:105px;align-items:end;margin:14px 0 5px">${array.map((v,i)=>`<div title="${f(v,0)} mg/Nm³ — ${valid[i]?'valid':'invalid'}" style="flex:1;height:${clamp(v/225*100,4,100)}%;border-radius:4px 4px 0 0;background:${valid[i]?'#159b91':'#bdc9ca'}"></div>`).join('')}</div><div class="range-limits"><span>Period start</span><span>Period end</span></div></div>`;return {body:stats([['Valid-sample average',f(avg,1),'mg/Nm³; not a legal reporting rule','highlight'],['Selected analyst result',f(selected,1),'mg/Nm³'],['Data completeness',pct(100*(12-p.invalid)/12),'valid records'],['Illustrative target check',exceeded?'Above target':'Below target',`target ${p.limit} mg/Nm³`,exceeded?'alert':'']])+bars+insight(`<span class="qual ${pass?'good':'bad'}">${pass?'The training record preserves critical traceability.':'The selected treatment or event documentation is incomplete.'}</span> ${p.handle==='zero'?'Replacing invalid values with zeros artificially lowers the calculated mean; do not use without a specifically approved approach.':p.handle==='interpolate'?'Carrying forward the last value invents replacement observations and is not automatically permitted for compliance.':'Keep invalid readings flagged; whether the period is reportable and what substitution is permitted depends on applicable regulation/permit.'} ${p.event==='yes'?'An event log should include start/end, source cause, estimated quantity/composition, corrective action and notification status.':''}`)+formula('Teaching arithmetic: mean of 12 readings if all valid vs mean of only flagged-valid records. This exercise does not set any RCER data-availability or averaging threshold.'),record:{validAvg:avg,selected,completeness:100*(12-p.invalid)/12,exceeded,reviewReady:pass}}}
 case 'economics':{const r=p.rate/100,n=p.life,crf=r*(1+r)**n/((1+r)**n-1),annualCapital=p.capex*1e6*crf,annual=annualCapital+p.opex*1e6,removed=p.baseline*p.eff/100,costPer=annual/removed;return {body:stats([['Uniform annual cost',`$${f(annual/1e6,2)}M`,'capitalized CAPEX + annual O&M','highlight'],['Emissions avoided',f(removed,1),'tonnes/year'],['Cost per tonne avoided',`$${f(costPer,0)}`,'USD per t of target pollutant'],['Added waste',f(p.waste,0),'tonnes/year; must be managed']])+multiBars([['Annualized CAPEX',annualCapital,'#428cb0'],['Annual OPEX',p.opex*1e6,'#df9158']],annual)+insight(`At the chosen finance assumptions, annual capital recovery is <b>${pct(crf*100)}</b> of installed CAPEX. Compare this result only among technically viable, compliant alternatives. Add energy/GHG, water/sludge, outages, reliability and costs that are not represented in this simple workbook.`)+formula('CRF = r(1+r)ⁿ / [(1+r)ⁿ − 1]<br>Annual cost = CAPEX × CRF + OPEX; cost effectiveness = annual cost / tonnes avoided.'),record:{annual,removed,costPer,crf}}}

function renderQuiz(){const set=quizSet();let idx=clamp(state.quizIdx,0,set.length-1);state.quizIdx=idx;let question=set[idx],key=`${state.quizDay}-${idx}`,ans=state.quizAnswers[key];let all=Object.keys(state.quizAnswers).length,done=set.filter((q,i)=>state.quizAnswers[`${state.quizDay}-${i}`]!==undefined).length,correct=set.filter((q,i)=>state.quizAnswers[`${state.quizDay}-${i}`]===q.correct).length;
 $('#view').innerHTML=`${title('SELF-ASSESSMENT','Explain before you calculate','Practice the engineering judgement required across the whole 200-page course. Answer once, then review the rationale and course-page reference.')}<div class="filters">${[['all','All days'],['1','Day 1'],['2','Day 2'],['3','Day 3']].map(([id,t])=>`<button class="filter-btn ${state.quizDay===id?'active':''}" data-quizday="${id}">${t}</button>`).join('')}</div><div class="quiz-shell"><div class="quiz-top"><div><strong>Question ${idx+1} of ${set.length}</strong> <span class="muted" style="font-size:12px">· Day ${question.day} · Course ${esc(question.ref)}</span></div><span class="pill">${correct} correct / ${done} attempted</span></div><div class="quiz-pbar"><div style="width:${done/set.length*100}%"></div></div><div class="question"><span class="small-label">INTERPRETATION / PROFESSIONAL JUDGEMENT</span><h2>${esc(question.q)}</h2><div class="answers">${question.a.map((o,i)=>`<button class="answer ${ans===i?'selected':''} ${ans!==undefined&&i===question.correct?'correct':''} ${ans===i&&ans!==question.correct?'wrong':''}" data-answer="${i}" ${ans!==undefined?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${ans!==undefined?`<div class="feedback ${ans===question.correct?'':'bad'}"><strong>${ans===question.correct?'Correct.':'Not quite.'}</strong> ${esc(question.why)}<br><span class="small-note">Original course source: ${esc(question.ref)}</span></div>`:''}</div><div class="quiz-bottom"><button class="button outline" data-quizmove="-1" ${idx===0?'disabled':''}>← Previous</button><span class="muted" style="font-size:12px">${done===set.length?`Completed · ${Math.round(correct/set.length*100)}% correct`:`${set.length-done} not yet answered`}</span><button class="button" data-quizmove="1" ${idx===set.length-1?'disabled':''}>Next question →</button></div>${done===set.length?`<div class="analysis-box"><b>Assessment completed</b><p>${correct}/${set.length} correct. You can review the explanations by navigating backward or choose another training day. Scores are stored locally in this browser.</p></div>`:''}</div>`}
function renderChallenges(){const answers=state.challenges;$('#view').innerHTML=title('OPERATIONAL DECISIONS','Make the refinery decision','Six realistic training vignettes connect source behavior, monitoring, control and compliance evidence. Select the best first response, then inspect the consequence.')+`<div class="challenge-grid">${CHALLENGES.map(c=>`<article class="challenge-card"><div class="meta"><span class="day-badge">DAY ${c.day}</span><span>COURSE PP. ${esc(c.pages)}</span></div><h3>${esc(c.title)}</h3><p style="font-size:13px;min-height:62px">${esc(c.scene)}</p><p><strong>${esc(c.ask)}</strong></p><div class="answers" style="margin-top:10px">${c.choices.map((opt,i)=>`<button class="answer ${answers[c.id]===i?'selected':''} ${answers[c.id]!==undefined&&i===c.answer?'correct':''} ${answers[c.id]===i&&answers[c.id]!==c.answer?'wrong':''}" style="padding:10px" data-challenge="${c.id}" data-choice="${i}" ${answers[c.id]!==undefined?'disabled':''}><span class="letter">${'ABC'[i]}</span><span style="font-size:12px">${esc(opt)}</span></button>`).join('')}</div>${answers[c.id]!==undefined?`<div class="challenge-outcome"><b>${answers[c.id]===c.answer?'Appropriate engineering response':'Review the response'}</b><p>${esc(c.why)}</p></div>`:''}</article>`).join('')}</div><div class="notice" style="margin-top:22px">Case exercises are instructional syntheses of the uploaded course content; they are not actual plant incidents, approved emergency procedures or legal interpretations.</div>`}
function renderSources(){let regs=[
 ['Course Day 1','pp. 3–77','Introduction, history, economics, operations, environmental risk','Source → impact → control decision → consequence'],
 ['Course Day 2','pp. 79–138','CEMS, portable equipment, data and RCER/compliance','Measurement chain → validated evidence → reporting'],
 ['Course Day 3','pp. 140–199','Engineering control, treatment, sectors, waste and cases','Design basis → treatment mechanism → verification'],
 ['RCER-2015 Vol. I §1','Course pp. 115–118','General regulatory system, EPC/EPO and obligations','Determine facility permit applicability'],
 ['RCER-2015 Vol. I §2','Course pp. 119–121','Air standards, stacks, BAT, CEMS, flares, fugitive components','Source emissions, specified monitoring, inventories'],
 ['RCER-2015 Table 2D','Course p. 87; p. 120','Source-specific CEMS configurations','FCCU / fuel-gas / Claus monitoring applicability'],
 ['RCER-2015 Vol. I §3','Course p. 122','Water discharges, pretreatment and containment','Liquid pathway / outfall controls'],
 ['RCER-2015 Vol. I §4','Course p. 123','Hazardous materials, storage, contingency planning','Spill, leak and emergency controls'],
 ['RCER-2015 Vol. I §5','Course p. 124; pp. 176–187','Waste classification, reduction, manifest, approved handlers','Waste generator to verified final fate'],
 ['RCER-2015 Vol. I §8','Course pp. 125, 133–137','QA, periodic reporting, records and deviations','Audit trail and reporting program']
];$('#view').innerHTML=title('COURSE + REGULATORY CROSSWALK','Regulatory compass and evidence map','Use this study navigator to find the source relevant to a refinery question. The 2015 rules in the course are historical training references, not a substitute for current source/permit verification.')+`<div class="notice warn"><strong>Regulatory boundary:</strong> The uploaded course explains RCER-2015 and its specific source examples. For actual refinery compliance, check the currently applicable Royal Commission regulations, updated conditions and your facility’s Environmental Permit to Operate.</div><table class="source-table"><thead><tr><th>Source / clause</th><th>Where in the pack</th><th>What to study</th><th>Practical question</th></tr></thead><tbody>${regs.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="section-heading"><h2>Source-to-proof workflow</h2></div><div class="steps">${[['01','Identify the emitting operation and the receiving medium'],['02','Identify the relevant pollutant, operating mode and applicable source category'],['03','Check the 2015 source clause and the site-specific permit requirements'],['04','Select the required measurement / estimation / testing evidence'],['05','Apply QA, averaging, documentation, corrective action and report duties']].map(([n,t])=>`<div class="step"><b>${n}</b><p>${t}</p></div>`).join('')}</div>`}
function renderGlossary(){const q=(state.glossaryQuery||'').toLowerCase();let terms=GLOSSARY.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q));$('#view').innerHTML=title('REFERENCE DESK','Essential terminology','The vocabulary behind stack monitoring, gas treatment, refinery operations, engineering economics and regulatory evidence.')+`<div class="filters"><input id="glossarySearch" class="input-search" type="search" placeholder="Search ~${GLOSSARY.length} definitions" value="${esc(state.glossaryQuery||'')}"></div><div class="glossary-grid" id="glossaryGrid">${terms.map(([term,definition])=>`<div class="gloss"><b>${esc(term)}</b><p>${esc(definition)}</p></div>`).join('')}</div>`}
function renderNotebook(){const arr=(state.saved||[]);const completed=Object.keys(state.completed).length;let answered=Object.keys(state.quizAnswers).length;$('#view').innerHTML=title('PERSONAL LEARNING RECORD','Evidence notebook','Keep a local record of simulation inputs and outputs so you can compare operating choices, then export a CSV for your own training notes.')+`<div class="kpi-grid"><div class="kpi"><div class="tag">Saved runs</div><div class="val">${arr.length}</div><div class="sub">This browser only</div></div><div class="kpi"><div class="tag">Sections studied</div><div class="val">${completed}</div><div class="sub">of ${COURSE.length}</div></div><div class="kpi"><div class="tag">Quiz responses</div><div class="val">${answered}</div><div class="sub">across quiz selections</div></div><div class="kpi"><div class="tag">Operational cases</div><div class="val">${Object.keys(state.challenges).length}</div><div class="sub">of ${CHALLENGES.length}</div></div></div><div class="filters"><button class="button" data-action="export" ${arr.length?'':'disabled'}>Export simulations (CSV)</button><button class="button outline" data-nav="labs">Run another lab</button></div>${arr.length?`<table class="source-table"><thead><tr><th>When saved</th><th>Lab</th><th>Key outputs</th><th>Action</th></tr></thead><tbody>${arr.slice().reverse().map((r,i)=>`<tr><td>${esc(r.at)}</td><td>${esc(r.name)}</td><td>${Object.entries(r.outputs).slice(0,4).map(([k,v])=>`${esc(k)}: ${esc(typeof v==='number'?f(v,2):v)}`).join(' · ')}</td><td><button class="button outline sm" data-loadrun="${arr.length-1-i}">Load</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><h3>No simulation runs saved yet</h3><p>Open any workshop, adjust the parameters and select “Save this simulation”.</p><button class="button" data-nav="labs">Open labs →</button></div>`}<div class="notice" style="margin-top:20px">Privacy: all progress and simulation records remain in local browser storage. This offline teaching file does not transmit personal data or connect to a server.</div>`}
function exportCsv(){const rows=[['date','lab','inputs','outputs']];for(const r of state.saved){rows.push([r.at,r.name,JSON.stringify(r.inputs),JSON.stringify(r.outputs)])}const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('refinery_emissions_lab_runs.csv',csv,'text/csv;charset=utf-8')}
function download(name,content,mime){let blob=new Blob([content],{type:mime}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function saveRun(){const l=getLab(state.labId),p=labParams(),result=calculation(l.id,p);state.saved.push({name:l.name,id:l.id,inputs:{...p},outputs:result.record,at:new Date().toLocaleString()});if(state.saved.length>80)state.saved.shift();keep();const b=document.querySelector('[data-action="saverun"]');if(b){b.textContent='Saved to notebook ✓';setTimeout(()=>{if(b.isConnected)b.textContent='Save this simulation'},1600)}}
function resetProgress(){if(!confirm('Reset your locally saved quiz answers, progress and simulation notebook?'))return;state={...initial,labState:{},saved:[],quizAnswers:{},challenges:{},completed:{}};keep();render()}
function eventHandler(ev){let el=ev.target.closest('[data-nav],[data-action],[data-module],[data-lab],[data-filter],[data-labfilter],[data-understood],[data-quizday],[data-quizmove],[data-answer],[data-challenge],[data-loadrun],[data-source]');if(!el)return;
 if(el.dataset.nav){if(el.dataset.filterday)state.filter=el.dataset.filterday;nav(el.dataset.nav);return}
 if(el.dataset.module){nav('module',{moduleId:el.dataset.module});return}
 if(el.dataset.lab){nav('lab',{labId:el.dataset.lab});return}
 if(el.dataset.source){state.source=el.dataset.source;keep();renderDashboard();return}
 if(el.dataset.filter){state.filter=el.dataset.filter;keep();renderModules();return}
 if(el.dataset.labfilter){state.labFilter=el.dataset.labfilter;keep();renderLabs();return}
 if(el.dataset.understood){state.completed[el.dataset.understood]=!state.completed[el.dataset.understood]?true:state.completed[el.dataset.understood];keep();render();return}
 if(el.dataset.quizday){state.quizDay=el.dataset.quizday;state.quizIdx=0;keep();renderQuiz();return}
 if(el.dataset.quizmove){state.quizIdx=clamp(state.quizIdx+Number(el.dataset.quizmove),0,quizSet().length-1);keep();renderQuiz();return}
 if(el.dataset.answer!==undefined){const key=`${state.quizDay}-${state.quizIdx}`;if(state.quizAnswers[key]===undefined){state.quizAnswers[key]=Number(el.dataset.answer);keep();renderQuiz()}return}
 if(el.dataset.challenge){if(state.challenges[el.dataset.challenge]===undefined){state.challenges[el.dataset.challenge]=Number(el.dataset.choice);keep();renderChallenges()}return}
 if(el.dataset.loadrun!==undefined){const r=state.saved[Number(el.dataset.loadrun)];if(r){state.labState[r.id]={...r.inputs};nav('lab',{labId:r.id})}return}
 const action=el.dataset.action;if(action==='reset'){resetProgress();return}if(action==='resetlab'){let l=getLab(state.labId);state.labState[l.id]={};keep();renderLab();return}if(action==='saverun'){saveRun();return}if(action==='export'){exportCsv();return}
}
document.addEventListener('click',eventHandler);
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.dataset.source){ev.preventDefault();state.source=ev.target.dataset.source;keep();renderDashboard()}});
document.addEventListener('input',ev=>{
 if(ev.target.matches('[data-field]')){const l=getLab(state.labId),fld=l.fields.find(a=>a.k===ev.target.dataset.field);if(!fld)return;const val=fld.type==='range'?Number(ev.target.value):ev.target.value;labParams()[fld.k]=val;const out=$(`#value-${fld.k}`);if(out)out.textContent=f(val,Number(fld.step)<1?1:0)+' '+fld.unit;updateLab();return}
 if(ev.target.id==='moduleSearch'){state.moduleQuery=ev.target.value;let q=state.moduleQuery.toLowerCase(),mods=COURSE.filter(m=>(state.filter==='all'||m.day===Number(state.filter))&&(`${m.title} ${m.short} ${m.fundamentals.join(' ')}`).toLowerCase().includes(q));$('#moduleGrid').innerHTML=mods.length?mods.map(moduleCard).join(''):'<div class="empty">No matching study modules.</div>';keep();return}
 if(ev.target.id==='glossarySearch'){state.glossaryQuery=ev.target.value;let q=state.glossaryQuery.toLowerCase();$('#glossaryGrid').innerHTML=GLOSSARY.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q)).map(([term,d])=>`<div class="gloss"><b>${esc(term)}</b><p>${esc(d)}</p></div>`).join('');keep();return}
});
render();

</script></body></html>
